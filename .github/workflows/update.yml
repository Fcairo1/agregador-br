name: Atualiza pesquisas

on:
  schedule:
    - cron: "17 */6 * * *" # a cada 6 horas
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/overrides.*.csv"
      - ".github/workflows/update.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Build (fetch + aggregate)
        run: node scripts/build.mjs

      - name: Commit se houver mudança
        run: |
          git config user.name  "agregador-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data site/data
          if git diff --cached --quiet; then
            echo "sem mudanças"
          else
            git commit -m "chore: atualiza pesquisas (bot)"
            git push
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
