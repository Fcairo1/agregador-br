<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="ui-sans-serif, -apple-system, Segoe UI, Roboto, Arial, sans-serif">
  <rect width="1200" height="630" fill="#0d0f13"/>
  <rect x="0" y="0" width="1200" height="6" fill="#E13037"/>
  <text x="80" y="120" fill="#e9ebf0" font-size="52" font-weight="700" letter-spacing="-1">Agregador de pesquisas</text>
  <text x="80" y="170" fill="#99a1af" font-size="30" font-weight="500">Brasil 2026 · presidente e governadores</text>

  <!-- mini gráfico -->
  <g transform="translate(80,230)">
    <rect width="1040" height="300" rx="14" fill="#14171d" stroke="#262b34"/>
    <g stroke="#1e232c" stroke-width="1">
      <line x1="40" y1="60" x2="1000" y2="60"/><line x1="40" y1="130" x2="1000" y2="130"/>
      <line x1="40" y1="200" x2="1000" y2="200"/><line x1="40" y1="260" x2="1000" y2="260"/>
    </g>
    <!-- faixa + linha Lula -->
    <path d="M40 95 C 260 88, 520 70, 1000 78 L1000 108 C 520 100, 260 118, 40 125 Z" fill="#E13037" fill-opacity="0.16"/>
    <path d="M40 110 C 260 103, 520 85, 1000 93" fill="none" stroke="#E13037" stroke-width="5" stroke-linecap="round"/>
    <!-- faixa + linha Flávio -->
    <path d="M40 150 C 300 140, 520 130, 1000 120 L1000 150 C 520 160, 300 170, 40 180 Z" fill="#1F4F9E" fill-opacity="0.16"/>
    <path d="M40 165 C 300 155, 520 145, 1000 135" fill="none" stroke="#1F4F9E" stroke-width="5" stroke-linecap="round"/>
    <text x="1010" y="98" fill="#E13037" font-size="24" font-weight="700">Lula</text>
    <text x="1010" y="140" fill="#5b86d6" font-size="24" font-weight="700">Flávio</text>
  </g>

  <text x="80" y="580" fill="#99a1af" font-size="24">Tendência por modelo de Kalman · faixa de incerteza · dados da Wikipédia (CC BY-SA)</text>
</svg>
